<style>
:root{--ink:#1b1326;--gold:#ffd884;--cream:#fff3dc;--ember:#e4502e;--display:'Pixelify Sans','IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}

button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#touch{display:block}
.pad{--h:clamp(54px,13vw,84px);position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));--w:clamp(70px,18vw,120px);width:var(--w);height:var(--h);display:grid;place-content:center;gap:.6em;text-align:center;font:500 clamp(11px,2.6vw,15px)/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:#eaf2ff;background:#16322e8c;border:1px solid #ffffff3a;border-radius:10px;touch-action:none;cursor:pointer;padding:0}

#tB,#tF{right:16px}#tF{bottom:calc(var(--h) + 24px + env(safe-area-inset-bottom))}#tG,#tR{right:calc(var(--w) + 26px)}#tR{bottom:calc(var(--h) + 24px + env(safe-area-inset-bottom))}#tG{background:#183a6a99}
#tV,#tT,#tU{bottom:auto;right:16px;width:auto;height:38px;padding:0 16px}#tV{top:calc(52px + env(safe-area-inset-top))}#tT{top:calc(96px + env(safe-area-inset-top));background:#5a3a1ecc}#tU{top:calc(140px + env(safe-area-inset-top))}
#tC{left:18px;bottom:calc(166px + env(safe-area-inset-bottom));width:92px;height:46px}
.pad.cd{opacity:.45}.chip2{flex-wrap:wrap;max-width:250px}.row{flex-basis:100%}.bar{display:inline-block;width:70px;height:8px;background:#fff3dc38}.bar i{display:block;height:100%;width:100%;background:var(--gold)}.bar.hot i{background:var(--ember)}

#boss{position:fixed;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));width:min(60vw,360px);height:10px;border:2px solid #ff4aa0;background:#1b1326cc;opacity:0;pointer-events:none}#boss.on{opacity:1}#boss i{display:block;height:100%;width:100%;background:#ff4aa0}

#shop{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);padding:16px;background:#1b1326f2;border:2px solid var(--gold)}#shop.on{display:block}#shop h2{margin:0 0 6px;font:700 22px var(--display);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}#shop p{margin:0 0 10px;font:500 12px var(--body);letter-spacing:.08em;text-transform:uppercase}#shop b{color:var(--gold);font-weight:500}

@media (pointer:coarse){#msn{top:calc(16px + env(safe-area-inset-top))}#boss{top:calc(52px + env(safe-area-inset-top))}}

.pips{justify-content:center}.pips em{width:3px;height:9px;background:#ffffff40}.pips em.on{background:#fff}
.chip2{position:fixed;left:16px;top:calc(60px + env(safe-area-inset-top));display:flex;gap:.8em;align-items:center;padding:.6em .9em;background:#1b1326cc;border-radius:6px;font:500 11.5px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;opacity:0;transition:opacity .6s}body.ready .chip2{opacity:1}.chip2 b{color:var(--gold);font-weight:500}
#hp em.on{background:#ff6a4a}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px #e4502e;opacity:0;transition:opacity .4s}#flash.on{opacity:.9;transition:none}
#alert{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;font:700 clamp(18px,4vw,34px)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 0 var(--ember),0 6px 0 var(--ink);opacity:0;transition:opacity .35s}#alert.on{opacity:1}
@media (pointer:coarse){.hints{display:none}.chip2{top:calc(16px + env(safe-area-inset-top))}#joy{display:block}}

/* ===== landscape, notches and small screens ===== */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ph:clamp(44px,13vh,76px);--pw:clamp(64px,19vh,112px);--joy:clamp(104px,34vh,156px);--bh:clamp(32px,9vh,40px)}

#sys{position:fixed;z-index:5;top:calc(14px + var(--st));right:calc(16px + var(--sr));display:flex;gap:6px}#sys .chip{position:static}
.pad{--h:var(--ph);--w:var(--pw);font:500 clamp(10px,2.7vh,14px)/1 var(--body);bottom:calc(12px + var(--sb))}
#tB,#tF{right:calc(16px + var(--sr))}#tG,#tR{right:calc(var(--pw) + 24px + var(--sr))}#tF,#tR{bottom:calc(var(--ph) + 20px + var(--sb))}
#tV,#tT,#tU{right:calc(16px + var(--sr));height:var(--bh);padding:0 14px;bottom:auto}
#tV{top:calc(60px + var(--st))}#tT{top:calc(68px + var(--bh) + var(--st))}#tU{top:calc(76px + 2*var(--bh) + var(--st))}
#joy{left:calc(18px + var(--sl));bottom:calc(14px + var(--sb));width:var(--joy);height:var(--joy)}
#tC{left:calc(18px + var(--sl));bottom:calc(var(--joy) + 24px + var(--sb));width:calc(var(--joy)*.72);height:clamp(34px,10vh,44px)}
.chip2{left:calc(16px + var(--sl));max-width:190px}
#stat #msn{position:static;transform:none;display:none;flex-basis:100%;padding:0;background:none;border:0;opacity:1;font-size:10.5px;color:var(--gold);white-space:normal}#stat #msn.on{display:block}
#uplist button.sel{outline:2px solid var(--gold)}
#rot{display:none;position:fixed;inset:0;z-index:30;place-items:center;text-align:center;background:#1b1326f5;font:700 clamp(16px,5vw,26px)/1.3 var(--display);color:var(--gold);letter-spacing:.05em;text-transform:uppercase}#rot button{margin-top:18px;font:500 13px var(--body);letter-spacing:.1em;color:var(--cream);background:none;border:1px solid #ffffff55;padding:.7em 1.3em;text-transform:uppercase}
@media (orientation:portrait) and (pointer:coarse){body:not(.norot) #rot{display:grid}}
@media (pointer:coarse) and (orientation:landscape){.chip2{top:calc(14px + var(--st))}#boss{left:calc(206px + var(--sl));right:calc(250px + var(--sr));transform:none;width:auto;top:calc(22px + var(--st))}}
@media (max-height:520px){.r2{display:none}.chip2{font-size:10.5px;padding:.45em .7em;gap:.5em .7em}#alert{top:18%}#wrn{top:30%}
 #shop{width:min(94vw,720px);padding:10px}#shop h2{font-size:18px}#shop p{margin-bottom:6px}#uplist{grid-template-columns:repeat(4,1fr)}#uplist button{padding:.5em;font-size:11px}#go{margin-top:8px;padding:.5em}
 #title{top:8%}#modebar{top:calc(8% + 160px)}.chip{padding:.6em .8em;font-size:10.5px}}
body.gp .pad,body.gp #joy{opacity:.28}
</style></head><body>
<canvas id="gl"></canvas><canvas id="ui"></canvas>
<header id="title"><h1>Patrol</h1><p><span id="msg">Spooling up the engines</span></p></header>
<div id="boot"><div id="bar"><i id="fill"></i></div></div>
<nav class="hints corner" aria-label="Controls"><span class="hint"><b>Mouse</b>steer</span><span class="hint"><b>Click</b>loop</span><span class="hint"><b>Hold</b>afterburner</span><span class="hint"><b>Right click</b>missile</span><span class="hint"><b>G</b>gun</span><span class="hint"><b>T</b>tank</span><span class="hint"><b>X</b>180</span><span class="hint"><b>C</b>flare</span><span class="hint"><b>Space</b>view</span></nav>
<div id="sys"><button type="button" id="fs" class="chip corner" aria-pressed="false">Full screen</button><button type="button" id="snd" class="chip corner" aria-pressed="false">Sound: off</button></div>
<div id="stat" class="chip2"><span>Hull</span><span class="pips" id="hp"></span><span>Boost</span><span class="bar" id="bb"><i></i></span><span class="row">Wave <b id="wv">0</b> · Score <b id="sc">0</b> <b id="mu"></b></span><span class="row r2">Kills <b id="ks">0</b> · Best <b id="bs">0</b></span></div><div id="wrn">Missile warning</div><div id="boss"><i></i></div><div id="msn"></div><div id="shop"><h2>Upgrades</h2><p>Credits <b id="cr">0</b> · next wave in <b id="nw">12</b>s</p><div id="uplist"></div><button id="go">Launch now</button></div><div id="modebar"><button id="dm">Free play</button></div><div id="flash"></div><div id="alert"></div>
<div id="rot"><div><p>Rotate your device to landscape</p><button id="rotok">Play anyway</button></div></div>
<div id="touch"><div id="joy"><i id="knob"></i></div><button id="tC" class="pad">Flare<small id="fl">4</small></button><button id="tR" class="pad">Loop</button><button id="tV" class="pad">View</button><button id="tG" class="pad">Gun<small id="gn">300</small></button><button id="tF" class="pad">Missile<span class="pips" id="ms"></span></button><button id="tB" class="pad">Boost</button><button id="tT" class="pad">Tank</button><button id="tU" class="pad">180</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id),TAU=Math.PI*2,N=512,TILE=4096,AMP=340,WL=.44,CY=250;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],sc=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],add=(a,b,s=1)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s],norm=a=>sc(a,1/(Math.hypot(a[0],a[1],a[2])||1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),lerp=(a,b,t)=>a+(b-a)*t;

// ---------- shaders ----------
const VS=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}`;
const FS=`#version 300 es
precision highp float;
uniform sampler2D T;uniform vec2 R;uniform vec3 O,F,Rt,U,JP;uniform float fl,tm,psi;uniform vec4 SC;uniform vec3 H0,H1,ZN,AM,SN,CLm;uniform float FG,SI,STR,FLH;
out vec4 oc;
const float TILE=${TILE}.,AMP=${AMP}.,WL=${WL},CY=${CY}.,TM=14000.;
const vec3 SUN=vec3(.5,.62,-.6);
float hh(vec2 p){return texture(T,p/TILE).r;}
float cd(vec2 p){vec2 q=p/TILE;return texture(T,q).b*.62+texture(T,q*3.+.37).b*.38;}
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float terr(vec2 p){return max(hh(p)*AMP,WL*AMP);}
vec3 hz(vec3 d){return mix(H0,H1,pow(max(dot(d,SUN),0.),4.));}
vec3 sky(vec3 d){float y=max(d.y,0.),s=max(dot(d,SUN),0.);
 vec3 c=mix(hz(d),ZN,pow(y,.45));
 c+=vec3(1.,.8,.55)*(pow(s,8.)*.28+pow(s,40.)*.3)*SI;
 c=mix(c,vec3(1.,.95,.8)*1.4,smoothstep(.9972,.9984,s)*SI);
 if(d.y>0.){vec2 q=d.xz/(d.y+.15)*.35+tm*.004;
  float cl=smoothstep(.46,.82,textureLod(T,q,0.).b)*smoothstep(0.,.14,d.y);
  vec3 cc=mix(vec3(.55,.6,.72),vec3(1.),.35+.65*smoothstep(.2,.8,textureLod(T,q*1.7+.3,0.).b))*clamp(dot(AM,vec3(.34))*1.1+.28,0.,1.)*CLm;
  c=mix(c,cc,cl*.72);
  c+=vec3(step(.99,hs(floor(d.xz/(d.y+.3)*220.))))*STR*smoothstep(.08,.35,d.y)*(1.-cl);}
 return c;}
bool jsh(vec3 p){if(JP.y<p.y)return false;vec3 S=normalize(vec3(.35,1.,-.45));vec2 c=JP.xz-S.xz/S.y*(JP.y-p.y),d=p.xz-c;
 float a=dot(d,vec2(sin(psi),-cos(psi))),b=dot(d,vec2(cos(psi),sin(psi)));
 return(abs(a)<9.&&abs(b)<2.)||(abs(a+1.5)<3.5&&abs(b)<8.5)||(abs(a+6.)<1.5&&abs(b)<4.5);}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/(.5*R.y);
 vec3 rd=normalize(uv.x*Rt+uv.y*U+fl*F);
 float t=1.,pt=1.;bool hit=false;
 for(int i=0;i<110;i++){vec3 q=O+rd*t;float d=q.y-terr(q.xz);if(d<1.){hit=true;break;}pt=t;t+=max(d*.5,.0035*t+.6);if(t>TM)break;}
 if(hit)for(int k=0;k<5;k++){float m=(pt+t)*.5;vec3 q=O+rd*m;if(q.y<terr(q.xz))t=m;else pt=m;}
 vec3 p=O+rd*t,col;
 if(!hit)col=sky(rd);
 else{
  float h=hh(p.xz);
  vec3 cs=p+SUN*((CY-p.y)/SUN.y);float csh=cd(cs.xz)>.78?.3:0.;
  if(h<=WL+.0008){
   float dp=(WL-h)*AMP;
   vec3 sh0=mix(vec3(.12,.74,.72),vec3(.02,.13,.36),smoothstep(0.,70.,dp));
   vec2 w=vec2(sin(p.x*.08+tm*1.3)*.15+sin(p.z*.19-tm*.9)*.1,cos(p.z*.07+tm*1.1)*.15+cos(p.x*.17+tm)*.1);
   vec3 nw=normalize(vec3(w.x,1.,w.y));
   float fr=pow(1.-clamp(dot(nw,-rd),0.,1.),4.)*.85+.04;
   vec3 rr=reflect(rd,nw);rr.y=abs(rr.y);
   vec3 wc=mix(sh0*(AM*.9+.12+SN*.15),sky(rr),fr);
   wc+=vec3(1.,.9,.7)*pow(max(dot(rr,SUN),0.),160.)*2.2*SI;
   wc=mix(wc,vec3(1.),(1.-smoothstep(0.,14.,dp))*(.45+.55*sin(p.x*.3+p.z*.2+tm*3.))*.7*clamp(dot(AM,vec3(.34))+.3,0.,1.));
   if(jsh(p)||csh>0.)wc*=.78;
   col=wc;
  }else{
   vec2 e=vec2(12.,0.);
   vec3 n=normalize(vec3(-(hh(p.xz+e.xy)-hh(p.xz-e.xy))*AMP/24.,1.,-(hh(p.xz+e.yx)-hh(p.xz-e.yx))*AMP/24.));
   vec2 q8=p.xz/TILE*9.;
   n=normalize(n-vec3(textureLod(T,q8+vec2(.002,0.),0.).g-textureLod(T,q8-vec2(.002,0.),0.).g,0.,textureLod(T,q8+vec2(0.,.002),0.).g-textureLod(T,q8-vec2(0.,.002),0.).g)*.6);
   float dif=clamp(dot(n,SUN),0.,1.),ra=h-WL,sl=1.-n.y;
   float fm=textureLod(T,p.xz/TILE*3.,0.).g,bv=textureLod(T,p.xz/TILE*2.,0.).b,fi=textureLod(T,p.xz/TILE*24.,0.).g;
   vec3 a=vec3(.86,.79,.54);
   a=mix(a,mix(vec3(.46,.6,.18),vec3(.22,.44,.13),smoothstep(.25,.6,bv)),smoothstep(.015,.05,ra));
   a=mix(a,vec3(.09,.26,.09)*(.75+.5*fi),smoothstep(.04,.12,ra)*smoothstep(.5,.62,fm)*(1.-smoothstep(.6,.75,h)));
   a=mix(a,vec3(.4,.35,.29),clamp(smoothstep(.11,.3,sl)+smoothstep(.62,.82,h)*.6,0.,1.));
   a=mix(a,vec3(.96,.97,1.),smoothstep(.8,.9,h+(bv-.5)*.1)*(1.-smoothstep(.22,.5,sl)));
   a*=.82+.36*fi;
   float vis=1.;
   for(int k=1;k<9;k++){vec3 s=p+SUN*(float(k*k)*13.+5.);vis=min(vis,smoothstep(-4.,22.,s.y-terr(s.xz)));}
   float sh=max(1.-vis,csh);if(jsh(p))sh=max(sh,.65);
   col=a*(AM+SN*dif*(1.-sh));
   float sd=length(p.xz-SC.xy);
   if(SC.z>0.&&sd<SC.z*(.85+.3*hs(floor(p.xz/3.)))){col*=.35;if(SC.w<5.&&hs(floor(p.xz/2.)+7.)>.93)col=vec3(1.,.55,.15);}
  }
  col=mix(col,hz(rd),clamp(1.-exp(-t*FG),0.,.95));
 }
 if(O.y>CY&&rd.y<-.0005){float tc=(CY-O.y)/rd.y;
  if(tc<(hit?t:TM)){vec3 cp=O+rd*tc;float c=cd(cp.xz);float k=smoothstep(.72,.9,c);
